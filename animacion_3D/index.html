<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Videojuego 3D - Taller de Gráficos</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #instrucciones {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="instrucciones">
        <strong>WASD</strong> para mover<br>
        <strong>← →</strong> para girar cámara<br>
        <strong>Objetivo:</strong> Toca la esfera roja ⭕
    </div>
    <div id="colisionInfo" style="position: absolute; top: 100px; left: 10px; color: #00ff00; font-family: sans-serif; background: rgba(0,0,0,0.5); padding: 10px; pointer-events: none;">
        Colisiones: 0
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
