<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>3D Video Game - JS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        #ui-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            z-index: 10;
        }

        #start-menu {
            text-align: center;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        #game-canvas {
            display: block;
        }
    </style>
    <div id="ui-layer">
        <div id="start-menu">
            <h1>MI VIDEOJUEGO 3D</h1>
            <p>Conecta tu control y presiona cualquier botón</p>
            <button onclick="startGame()">INICIAR JUEGO</button>
        </div>
    </div>
    <canvas id="game-canvas"></canvas>

    <audio id="hit-sound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module" src="script.js"></script>
</body>

</html>
